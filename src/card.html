<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <title>Card</title>
  </head>
  <body>
    <card>
      <img src="./img/png/san_francisco.webp" alt="San Francisco" />
      <content>
        <div class="texts">
          <h2 class="heading-3">San Francisco</h2>
          <p class="Premium">Premium economy</p>
        </div>
        <div class="informations">
          <div class="info">
            <img src="./img/svg/tag.svg" alt="tag" />
            <p>From <p class="bold">900 CHF</p></p>
          </div>
          <div class="info">
            <img src="./img/svg/plane.svg" alt="plane" />
            <p class="bold">SFO</p>
          </div>
        </div>
        <div class="CTAs small">
          <button class="mainbtn">Search flight</button>
          <button class="favourite secondary">
            <img src="./img/svg/heart.svg" alt="favourite" />
          </button></div
      ></content>
    </card>
  </body>
</html>
