<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
    <title>Card</title>
  </head>
  <body>
    <card>
      <img src="./img/png/san_francisco.webp" alt="San Francisco" />
      <div class="texts">
        <h2 class="heading-3">San Francisco</h2>
        <p>Premium economy</p>
      </div>
      <div class="informations">
        <div class="price">
          <img src="./img/svg/tag.svg" alt="tag" />
          <p>From <bold>900 CHF</bold></p>
        </div>
        <div class="airport">
          <img src="./img/svg/plane.svg" alt="plane" />
          <bold>SFO</bold>
        </div>
        <div class="CTAs small">
          <button class="">Search flight</button>
          <div class="zone-secondary">
            <button
              class="favourite secondary"
              style="background-color: var(--color-primary-0)"
            >
              <img src="./img/svg/heart.svg" alt="favourite" />
            </button>
          </div>
        </div>
      </div>
    </card>
  </body>
</html>
